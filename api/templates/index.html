<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velio — Unicode sanitizer for LLM input</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* --- Design tokens: dark (default) --- */
    :root {
      --bg:            #0f1117;
      --bg-panel:      #161b22;
      --bg-input:      #0d1117;
      --bg-active:     #21262d;
      --border:        #30363d;
      --border-active: #21262d;
      --text:          #c9d1d9;
      --text-heading:  #e6edf3;
      --text-muted:    #8b949e;
      --text-empty:    #6e7681;
      --accent:        #58a6ff;
      --btn-bg:        #238636;
      --btn-border:    #2ea043;
      --btn-hover:     #2ea043;
      --btn-active:    #1a7f37;
      --marker-bg:     #3d1f00;
      --marker-border: #7d3b00;
      --marker-text:   #f0883e;
      --nonzero:       #f0883e;
      --error:         #f85149;
      --cp-bg:         #21262d;
      --theme-btn-bg:  #21262d;
      --theme-btn-border: #30363d;
      --theme-btn-color:  #8b949e;
    }

    /* --- Design tokens: light --- */
    :root.light {
      --bg:            #ffffff;
      --bg-panel:      #f6f8fa;
      --bg-input:      #ffffff;
      --bg-active:     #eaeef2;
      --border:        #d0d7de;
      --border-active: #d0d7de;
      --text:          #1f2328;
      --text-heading:  #1f2328;
      --text-muted:    #57606a;
      --text-empty:    #8c959f;
      --accent:        #0969da;
      --btn-bg:        #1a7f37;
      --btn-border:    #1a7f37;
      --btn-hover:     #2da44e;
      --btn-active:    #116329;
      --marker-bg:     #fff3cd;
      --marker-border: #e0a800;
      --marker-text:   #7d4e00;
      --nonzero:       #b35900;
      --error:         #cf222e;
      --cp-bg:         #eaeef2;
      --theme-btn-bg:  #f6f8fa;
      --theme-btn-border: #d0d7de;
      --theme-btn-color:  #57606a;
    }

    /* --- Follow OS preference unless manually overridden --- */
    @media (prefers-color-scheme: light) {
      :root:not(.dark) {
        --bg:            #ffffff;
        --bg-panel:      #f6f8fa;
        --bg-input:      #ffffff;
        --bg-active:     #eaeef2;
        --border:        #d0d7de;
        --border-active: #d0d7de;
        --text:          #1f2328;
        --text-heading:  #1f2328;
        --text-muted:    #57606a;
        --text-empty:    #8c959f;
        --accent:        #0969da;
        --btn-bg:        #1a7f37;
        --btn-border:    #1a7f37;
        --btn-hover:     #2da44e;
        --btn-active:    #116329;
        --marker-bg:     #fff3cd;
        --marker-border: #e0a800;
        --marker-text:   #7d4e00;
        --nonzero:       #b35900;
        --error:         #cf222e;
        --cp-bg:         #eaeef2;
        --theme-btn-bg:  #f6f8fa;
        --theme-btn-border: #d0d7de;
        --theme-btn-color:  #57606a;
      }
    }

    body {
      font-family: ui-monospace, "Cascadia Code", "Fira Mono", monospace;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    .header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 0.25rem;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-heading);
    }

    #theme-btn {
      background: var(--theme-btn-bg);
      border: 1px solid var(--theme-btn-border);
      border-radius: 6px;
      color: var(--theme-btn-color);
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 400;
      padding: 0.2rem 0.6rem;
    }

    #theme-btn:hover { opacity: 0.8; }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 0.6rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus { border-color: var(--accent); }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1rem 0;
    }

    button {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 0.4rem 1.2rem;
    }

    button:hover { background: var(--btn-hover); }
    button:active { background: var(--btn-active); }

    .mode-toggle {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .mode-toggle input[type="radio"] { display: none; }

    .mode-toggle label {
      margin: 0;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      color: var(--text-muted);
      text-transform: none;
      letter-spacing: 0;
      font-size: 13px;
      background: var(--bg-input);
      border-right: 1px solid var(--border);
      user-select: none;
    }

    .mode-toggle label:last-of-type { border-right: none; }

    .mode-toggle input[type="radio"]:checked + label {
      background: var(--bg-active);
      color: var(--text-heading);
    }

    .output-area {
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 13px;
      min-height: 6rem;
      padding: 0.6rem;
      line-height: 1.6;
    }

    .output-area.empty { color: var(--text-empty); font-style: italic; }

    /* highlight [U+XXXX] markers */
    .marker {
      background: var(--marker-bg);
      border: 1px solid var(--marker-border);
      border-radius: 3px;
      color: var(--marker-text);
      font-size: 11px;
      padding: 0 3px;
    }

    .findings {
      margin-top: 1rem;
    }

    .findings table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
    }

    .findings th {
      color: var(--text-muted);
      font-weight: 400;
      padding: 0.3rem 0.5rem;
      text-align: left;
      border-bottom: 1px solid var(--border-active);
    }

    .findings td {
      padding: 0.3rem 0.5rem;
      border-bottom: 1px solid var(--border-active);
      color: var(--text);
    }

    .findings td.zero { color: var(--text-empty); }
    .findings td.nonzero { color: var(--nonzero); font-weight: 600; }

    .codepoints {
      margin-top: 0.5rem;
      font-size: 11px;
      color: var(--text-muted);
      word-break: break-all;
    }

    .codepoints span {
      background: var(--cp-bg);
      border-radius: 3px;
      display: inline-block;
      margin: 2px;
      padding: 1px 5px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 13px;
      color: var(--text-muted);
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
      margin: 0;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
      width: 14px;
      height: 14px;
    }

    .error-msg {
      color: var(--error);
      font-size: 12px;
      margin-top: 0.5rem;
    }

    .grid {
      display: grid;
      gap: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Velio Sanitizer</h1>
    <button id="theme-btn">light</button>
  </div>
  <p class="subtitle">Detect and remove hidden Unicode characters — zero-width spaces, bidi overrides, and variation selectors — before sending text to an LLM.</p>

  <div class="grid">
    <div class="panel">
      <label>Input text</label>
      <textarea id="input" rows="8" placeholder="Paste untrusted text here..."></textarea>

      <div class="controls">
        <button id="btn">Sanitize</button>
        <div class="mode-toggle">
          <input type="radio" name="mode" id="mode-mark" value="mark" checked>
          <label for="mode-mark">mark</label>
          <input type="radio" name="mode" id="mode-strip" value="strip">
          <label for="mode-strip">strip</label>
        </div>
        <label class="checkbox-label" for="opt-vs">
          <input type="checkbox" id="opt-vs">
          variation selectors
        </label>
      </div>
    </div>

    <div class="panel">
      <label>Output</label>
      <div class="output-area empty" id="output">Output will appear here.</div>
      <div id="error" class="error-msg" style="display:none"></div>

      <div class="findings" id="findings" style="display:none">
        <table>
          <thead>
            <tr>
              <th>Category</th>
              <th>Removed</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Control (Cc)</td><td id="f-control" class="zero">0</td></tr>
            <tr><td>Format (Cf)</td><td id="f-format" class="zero">0</td></tr>
            <tr><td>Bidi</td><td id="f-bidi" class="zero">0</td></tr>
            <tr><td>Variation selectors</td><td id="f-vs" class="zero">0</td></tr>
            <tr><td><strong>Total</strong></td><td id="f-total" class="zero">0</td></tr>
          </tbody>
        </table>
        <div class="codepoints" id="codepoints"></div>
      </div>
    </div>
  </div>

  <script>
    const btn = document.getElementById("btn");
    const inputEl = document.getElementById("input");
    const outputEl = document.getElementById("output");
    const errorEl = document.getElementById("error");
    const findingsEl = document.getElementById("findings");

    function cell(id, value) {
      const el = document.getElementById(id);
      el.textContent = value;
      el.className = value === 0 ? "zero" : "nonzero";
    }

    function renderOutput(text, mode) {
      if (mode !== "mark") {
        outputEl.textContent = text;
        return;
      }
      // Highlight [U+XXXX] tokens produced by mark mode.
      const parts = text.split(/(\[U\+[0-9A-F]{4,6}\])/);
      outputEl.innerHTML = "";
      for (const part of parts) {
        if (/^\[U\+[0-9A-F]{4,6}\]$/.test(part)) {
          const span = document.createElement("span");
          span.className = "marker";
          span.textContent = part;
          outputEl.appendChild(span);
        } else {
          // Use textContent on a text node — never set innerHTML from input.
          outputEl.appendChild(document.createTextNode(part));
        }
      }
    }

    btn.addEventListener("click", async () => {
      const text = inputEl.value;
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const strip_variation_selectors = document.getElementById("opt-vs").checked;

      errorEl.style.display = "none";
      findingsEl.style.display = "none";
      outputEl.className = "output-area empty";
      outputEl.textContent = "Sanitizing...";

      let resp, data;
      try {
        resp = await fetch("/sanitize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, mode, strip_variation_selectors }),
        });
        data = await resp.json();
      } catch (e) {
        outputEl.textContent = "";
        errorEl.textContent = "Network error: " + e.message;
        errorEl.style.display = "block";
        return;
      }

      if (!resp.ok) {
        outputEl.textContent = "";
        const detail = data.detail?.[0]?.msg ?? JSON.stringify(data.detail);
        errorEl.textContent = "Error " + resp.status + ": " + detail;
        errorEl.style.display = "block";
        return;
      }

      outputEl.className = "output-area";
      renderOutput(data.text, mode);

      const f = data.findings;
      cell("f-control", f.removed_control);
      cell("f-format", f.removed_format);
      cell("f-bidi", f.removed_bidi);
      cell("f-vs", f.removed_variation_selectors);
      cell("f-total", f.total);

      const cpEl = document.getElementById("codepoints");
      cpEl.innerHTML = "";
      if (f.codepoints.length > 0) {
        const label = document.createTextNode("Removed codepoints: ");
        cpEl.appendChild(label);
        for (const cp of f.codepoints) {
          const s = document.createElement("span");
          const hex = cp.toString(16).toUpperCase();
          s.textContent = "U+" + hex.padStart(hex.length > 4 ? 5 : 4, "0");
          cpEl.appendChild(s);
        }
      }

      findingsEl.style.display = "block";
    });

    // Allow Ctrl+Enter to submit.
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) btn.click();
    });

    // Theme toggle — persists across page reloads via localStorage.
    const themeBtn = document.getElementById("theme-btn");
    const root = document.documentElement;
    const osLight = window.matchMedia("(prefers-color-scheme: light)");

    function applyTheme(theme) {
      root.classList.toggle("light", theme === "light");
      root.classList.toggle("dark", theme === "dark");
      themeBtn.textContent = theme === "light" ? "dark" : "light";
      localStorage.setItem("theme", theme);
    }

    // On load: use stored preference, otherwise follow OS.
    const stored = localStorage.getItem("theme");
    applyTheme(stored ?? (osLight.matches ? "light" : "dark"));

    themeBtn.addEventListener("click", () => {
      applyTheme(root.classList.contains("light") ? "dark" : "light");
    });
  </script>
</body>
</html>
