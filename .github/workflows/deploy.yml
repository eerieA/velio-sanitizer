name: Deploy

on:
  push:
    branches: [main]

# Minimal permissions for this workflow. `packages: write` is needed to push
# to GHCR. `contents: read` is the minimum for checkout.
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
        # Cache is safe here: this workflow only runs on push to main (your own
        # code), never on fork PRs, so there is no poisoning risk.

      - name: Cache pip
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          push: true
          # Tag with the commit SHA for traceability, and as `latest` for Render to pull.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      # --- Render deploy hook ---
      # This is the only Render-specific step. To switch providers, replace
      # this step with whatever your new provider requires (e.g. a Railway
      # CLI call, a Fly.io `flyctl deploy`, or a webhook to another service).
      #
      # Setup:
      #   1. In Render: Dashboard → your service → Settings → Deploy Hook → copy URL
      #   2. In GitHub: Settings → Secrets → Actions → New secret
      #      Name: RENDER_DEPLOY_HOOK_URL   Value: <the URL from step 1>
      #   3. In Render: set the image to ghcr.io/<your-org>/<your-repo>:latest
      - name: Trigger Render deploy
        run: |
          curl --silent --show-error --fail \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
